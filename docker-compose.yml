version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: swachhsetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swachhsetu
      POSTGRES_PASSWORD: swachhsetu_password_2026
      POSTGRES_DB: swachhsetu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swachhsetu -d swachhsetu_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: swachhsetu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://swachhsetu:swachhsetu_password_2026@postgres:5432/swachhsetu_db?schema=public
      JWT_SECRET: swachhsetu_jwt_secret_production_2026_super_secure_key
      JWT_EXPIRES_IN: 7d
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGIN: "*"
      STORAGE_DRIVER: local
    ports:
      - "5000:5000"
    volumes:
      - backend-uploads:/app/backend/uploads

  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../infrastructure/docker/Dockerfile.ai
    container_name: swachhsetu-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      AI_ENV: production
      CONFIDENCE_THRESHOLD_APPROVED: 0.85
      CONFIDENCE_THRESHOLD_REVIEW: 0.60
      MODEL_VERSION: swachhsetu-waste-v2.1
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: swachhsetu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  backend-uploads:

